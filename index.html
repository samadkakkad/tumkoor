<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TUMKOOR Profit Sharing</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    padding: 0 10px;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
  }
  .dropdowns {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  select, input[type="number"] {
    flex: 1 1 45%;
    padding: 8px;
    font-size: 16px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
  }
  .profit-list {
    margin-top: 20px;
    font-size: 16px;
    white-space: pre-line;
  }
  .profit-list div {
    margin: 5px 0;
  }
  button {
    margin-top: 20px;
    padding: 12px;
    width: 100%;
    font-size: 16px;
    background-color: #007bff;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 5px;
  }
  button:hover {
    background-color: #0056b3;
  }
  @media (max-width: 400px) {
    .dropdowns {
      flex-direction: column;
    }
    select, input[type="number"] {
      flex: 1 1 100%;
    }
  }
</style>
</head>
<body>

<h1>TUMKOOR</h1>

<div class="dropdowns">
  <div style="flex:1 1 45%;">
    <label for="year">Year</label>
    <select id="year" name="year">
      <option value="2025" selected>2025</option>
      <option value="2026">2026</option>
      <option value="2027">2027</option>
    </select>
  </div>
  <div style="flex:1 1 45%;">
    <label for="month">Month</label>
    <select id="month" name="month">
      <option value="January">January</option>
      <option value="February">February</option>
      <option value="March">March</option>
      <option value="April">April</option>
      <option value="May">May</option>
      <option value="June">June</option>
      <option value="July">July</option>
      <option value="August">August</option>
      <option value="September">September</option>
      <option value="October">October</option>
      <option value="November">November</option>
      <option value="December">December</option>
    </select>
  </div>
</div>

<div>
  <label for="totalProfit">Total Profit</label>
  <input type="number" id="totalProfit" name="totalProfit" placeholder="Enter total profit" min="0" />
</div>

<div class="profit-list" id="profitList">
  <!-- Profit details will appear here -->
</div>

<button id="copyBtn">Copy to WhatsApp</button>

<script>
  const totalProfitInput = document.getElementById('totalProfit');
  const profitList = document.getElementById('profitList');
  const yearSelect = document.getElementById('year');
  const monthSelect = document.getElementById('month');
  const copyBtn = document.getElementById('copyBtn');

  const partners = [
    {name: 'Abdusamad', ratio: 9},
    {name: 'Ramsi', ratio: 6},
    {name: 'Rasak', ratio: 5},
    {name: 'Shameel', ratio: 3}
  ];

  function formatNumber(num) {
    return num.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function updateProfits() {
    const totalProfit = parseFloat(totalProfitInput.value);
    if (isNaN(totalProfit) || totalProfit < 0) {
      profitList.innerHTML = '';
      return;
    }

    // Step 1: Profit for Shareholders (80%)
    const profitForShareholders = totalProfit * 0.80;

    // Step 2: Profit for 1%
    const profitForOnePercent = profitForShareholders * 0.01;

    // Step 3: Profit for 78%
    const profitForSeventyEightPercent = profitForOnePercent * 0.78;

    const totalRatio = partners.reduce((sum, p) => sum + p.ratio, 0);

    let html = `<div><strong>Profit Sharing for ${monthSelect.value} ${yearSelect.value}:</strong></div>`;
    html += `<div>Total Profit : ₹${formatNumber(totalProfit)}</div>`;
    html += `<div>Profit for Shareholders (80%) : ₹${formatNumber(profitForShareholders)}</div>`;
    html += `<div>Profit for 1% : ₹${formatNumber(profitForOnePercent)}</div>`;
    html += `<div>Profit for 78% : ₹${formatNumber(profitForSeventyEightPercent)}</div>`;
    html += `<br><div><strong>Shareholders Profit Distribution:</strong></div>`;

    partners.forEach(p => {
      const share = profitForSeventyEightPercent * p.ratio / totalRatio;
      html += `<div>${p.name}: ₹${formatNumber(share)}</div>`;
    });

    profitList.innerHTML = html;
  }

  totalProfitInput.addEventListener('input', updateProfits);
  yearSelect.addEventListener('change', updateProfits);
  monthSelect.addEventListener('change', updateProfits);

  copyBtn.addEventListener('click', () => {
    const totalProfit = parseFloat(totalProfitInput.value);
    if (isNaN(totalProfit) || totalProfit < 0) {
      alert('Please enter a valid Total Profit value.');
      return;
    }

    const profitForShareholders = totalProfit * 0.80;
    const profitForOnePercent = profitForShareholders * 0.01;
    const profitForSeventyEightPercent = profitForOnePercent * 0.78;
    const totalRatio = partners.reduce((sum, p) => sum + p.ratio, 0);

    let text = `TUMKOOR Profit Sharing\nMonth: ${monthSelect.value} ${yearSelect.value}\n\n`;
    text += `Total Profit : ₹${formatNumber(totalProfit)}\n`;
    text += `Profit for Shareholders (80%) : ₹${formatNumber(profitForShareholders)}\n`;
    text += `Profit for 1% : ₹${formatNumber(profitForOnePercent)}\n`;
    text += `Profit for 78% : ₹${formatNumber(profitForSeventyEightPercent)}\n\n`;
    text += `Shareholders Profit Distribution:\n`;

    partners.forEach(p => {
      const share = profitForSeventyEightPercent * p.ratio / totalRatio;
      text += `${p.name}: ₹${formatNumber(share)}\n`;
    });

    navigator.clipboard.writeText(text).then(() => {
      alert('Profit details copied to clipboard. You can now paste it on WhatsApp.');
    }, () => {
      alert('Failed to copy. Please copy manually.');
    });
  });
</script>

</body>
</html>
